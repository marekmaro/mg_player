name: Build APK

# Oszczędzanie minut GitHub Actions (prywatne repozytorium = limit miesięczny):
# - zmiany w samych dokumentach nie uruchamiają budowania,
# - przy każdej zmianie: build, testy jednostkowe, lint i JEDEN emulator (Android 14),
# - pełny zestaw emulatorów (Android 8, 11 z dużą czcionką, 14): raz w tygodniu
#   albo ręcznie (Actions → Build APK → Run workflow → full: true),
# - nowy przebieg przerywa starszy dla tej samej gałęzi.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # poniedziałek 3:17 UTC – pełny zestaw
  workflow_dispatch:
    inputs:
      full:
        description: 'Wszystkie emulatory (8, 11, 14)'
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections, os
          p = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(p):
              print("brak raportu lint"); raise SystemExit
          issues = ET.parse(p).getroot().findall("issue")
          print(f"LINT: {len(issues)} uwag")
          for i in issues:
              loc = i.find("location")
              where = f'{loc.get("file","").split("/app/")[-1]}:{loc.get("line","")}' if loc is not None else ""
              print(f'LINT {i.get("severity")} {i.get("id")} {where} :: {i.get("message")}')
          PY

      # Artefakty kasują się same po kilku dniach (limit miejsca w prywatnym repozytorium),
      # a brak miejsca nie przerywa budowania.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: equinox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # wersja release (R8) podpisana kluczem testowym
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: equinox-release-test-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 3

  # Test na prawdziwym emulatorze Androida: instalacja, pliki testowe,
  # przejście po ekranach, zrzuty ekranu i sprawdzenie, czy nic się nie wywraca.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # zwykła zmiana: tylko Android 14; tygodniowo i na żądanie: wszystkie trzy
        include: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) && '[{"name":"android8","api":26,"font":"1.0"},{"name":"android11-duza-czcionka","api":30,"font":"1.3"},{"name":"android14","api":34,"font":"1.0"}]' || '[{"name":"android14","api":34,"font":"1.0"}]') }}
    name: smoke-test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      # każdy emulator buduje APK sam (nie zależy od miejsca na artefakty)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build release APK (R8)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p apk && cp app/build/outputs/apk/release/*.apk apk/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: FONT_SCALE=${{ matrix.font }} bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-screenshots-${{ matrix.name }}
          path: smoke/
          retention-days: 3
