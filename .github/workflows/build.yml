name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections, os
          p = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(p):
              print("brak raportu lint"); raise SystemExit
          issues = ET.parse(p).getroot().findall("issue")
          print(f"LINT: {len(issues)} uwag")
          for i in issues:
              loc = i.find("location")
              where = f'{loc.get("file","").split("/app/")[-1]}:{loc.get("line","")}' if loc is not None else ""
              print(f'LINT {i.get("severity")} {i.get("id")} {where} :: {i.get("message")}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: equinox-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # wersja release (R8) podpisana kluczem testowym – do testu na emulatorze
      - uses: actions/upload-artifact@v4
        with:
          name: equinox-release-test-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  # Test na prawdziwym emulatorze Androida: instalacja, pliki testowe,
  # przejście po ekranach, zrzuty ekranu i sprawdzenie, czy nic się nie wywraca.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android8        # najstarszy obsługiwany Android (minSdk 26)
            api: 26
            font: "1.0"
          - name: android11-duza-czcionka   # ułatwienia dostępu: tekst 130%
            api: 30
            font: "1.3"
          - name: android14
            api: 34
            font: "1.0"
    name: smoke-test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: equinox-release-test-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: FONT_SCALE=${{ matrix.font }} bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.name }}
          path: smoke/
